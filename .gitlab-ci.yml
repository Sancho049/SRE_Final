image: python:3.9

stages:
  - test
  - deploy

test:
  stage: test
  script:
    - |
      python -m venv venv
      source venv/bin/activate
      pip install --upgrade pip
      pip install -r requirements.txt
      export PYTHONPATH=$PYTHONPATH:$(pwd)/myblog
      export DJANGO_SETTINGS_MODULE=myblog.settings
      python myblog/manage.py test

deploy:
  stage: deploy
  script:
    - echo "Deploying application..."
